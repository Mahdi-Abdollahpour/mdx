

[global]
label = 'ha02_10' # all relevant files such as weights will use this label
ebno = True # activate rate-adjusted SNR

[system]
n_size_bwp = 10
num_rx_antennas = 4 # 2*num_cols_per_panel*num_rows_per_panel
mcs_index = [14]
mcs_table = 1
carrier_frequency = 2000000000.0
subcarrier_spacing = 30000.0
n_start_grid = 0
slot_number = 0
frame_number = 0
cyclic_prefix = 'normal'
precoding = 'codebook'
n_cell_id = 1
tpmi = 2
symbol_allocation = [0, 14]
num_antenna_ports = 2
dmrs_mapping_type = "A"
dmrs_config_type = 1
dmrs_type_a_position = 2
dmrs_additional_position = 1
dmrs_length = 1
dmrs_nid = [[1, 1], [1, 1]]
n_scid = 1
num_cdm_groups_without_data = 2
verbose = False
dmrs_port_sets = [[2], [1], [2], [3]]
n_rntis = [1, 1]
n_ids = [1, 1]

[baseline]
demapping_type = 'maxlog'
num_bp_iter = 20
cn_type = 'boxplus'
lmmse_num_prbs = -1 # n_size_bwp must be multiple of this constant

[AI Network]
block_config = [
    {"type": "HA02", "feeds": [0], "name": "ha02", "save":'channel'},

    {"type":"ChLoss", "feeds":[-1, '$noise', '$shapes'], "target":'channel_ofdm',
                        "lambda_tot":1., "snr_weighting":False, # loss: 'huber' | 'mse'
                        "time_steps":'all', # time-steps to apply loss on: 'pilots' | 'all'
                        "loss_type":'huber', "delta":1., "name":'ch_loss'},]

loss_fields = [
    {"type":'ChLoss', "fields":["MSE", "Total"]},
    {"type":'LLRLoss', "fields":["BCE", "Total"]}]

[Geometric Channels]
random_num_clusters = False
random_num_rays = False
mask_doa = False

[neural_receiver]
num_nrx_iter = 1 # defines number of cgnn_it stages
num_nrx_iter_eval = 1 # iterations used for evaluation; must be <= num_nrx_iter

max_num_tx = 2 # max number of active DMRS ports
min_num_tx = 1 # only relevant during training for random user sampling
initial_chest = "ls" # "None" deactivates initial LS estimation
custom_constellation = False # activates trainable transmitter
mask_pilots = False # mask DMRS positions for e2e experiments

dtype = tf.complex64

[transfer_learning]
start_token_model = ''
start_token_file  = 'deep_echo5g'

[training]
training_schedule = {
    "num_iter": [50e3, 100e3, 200e3],
    "learning_rate": [0.001, 0.0001, 0.00001],
    "batch_size": [128, 128, 128],
    "train_tx": [False, False,False],
    "min_training_snr_db": [[-1., -1.], [-1., -1.],[-1., -1.]], # 1 / 2 active UEs, is Eb/No [dB] if ebno==True
    "max_training_snr_db": [[25., 25.], [25., 25.],[25., 25.]], # 1 / 2 active UEs, is Eb/No [dB] if ebno==True
    "double_readout": [True, True, True], # use additional MSE loss on h_hat
    "apply_multiloss": [True, True, True],
    "weighting_double_readout": [[.01,0.0], [.01,0.0], [.01,0.0]], # MSE h weight
    "cgnn_steps": [-1, -1, -1]} # num cgnn steps to be repeated for any i<=num_it.| 0: random cgnn_steps| -1 : only num_nrx_iter,

num_iter_train_save = 1000
num_iter_step = 1000
max_ut_velocity = 34.
min_ut_velocity = 0.
channel_norm = False
cfo_offset_ppm = 0.0 # randomly sampled in [-cfo_offset_ppm, cfo_offset_ppm]
channel_type = 'UMi'
eval_ebno_db_arr =  [[-8, 0.0, 8.0, 16.0, 24]]   # EbNo to evaluate model for each MCS during training
xla = True # Activate XLA for the training loop
tfrecord_filename = "na" # only relevant if training is done with a dataset
mat_filename = ""

[evaluation]
snr_db_eval_min = -5
snr_db_eval_max = 12
snr_db_eval_stepsize = 1
max_ut_velocity_eval = 34
min_ut_velocity_eval = 0
cfo_offset_ppm_eval = 0.0
tfrecord_filename_eval = "na"
channel_type_eval = "DoubleTDLlow" # 2 Users
channel_norm_eval = False
n_size_bwp_eval = 22
batch_size_eval = 30
batch_size_eval_small = 3 # for k-best-based baselines
mat_filename_eval="na"
